[package]
name = "gridcraft-vba"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional tiny-vba workbook host and debugger integration"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vba-compiler = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-diagnostics = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-syntax = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-vm = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-ir = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
gridcraft-engine = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-model = { workspace = true }
vba-foreign = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-ide = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-project = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }
vba-values = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }

vba-runtime = { git = "https://github.com/matt123p/tiny-vba.git", rev = "b7010bd2738bbcac87a018b94bd261c2d8533f24" }

[dev-dependencies]
image = { workspace = true }
gridcraft-xlsx = { workspace = true }
cfb = "=0.14.0"
web-time = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
