[package]
name = "gridcraft-vba"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional tiny-vba workbook host and debugger integration"

[lints]
workspace = true

[dependencies]
gridcraft-engine = { workspace = true }
serde_json = { workspace = true }
vba-foreign = { git = "https://github.com/matt123p/tiny-vba.git", rev = "4d80a9584b3daeb75d589c629eff272ecd5881fe" }
vba-ide = { git = "https://github.com/matt123p/tiny-vba.git", rev = "4d80a9584b3daeb75d589c629eff272ecd5881fe" }
vba-project = { git = "https://github.com/matt123p/tiny-vba.git", rev = "4d80a9584b3daeb75d589c629eff272ecd5881fe" }
vba-values = { git = "https://github.com/matt123p/tiny-vba.git", rev = "4d80a9584b3daeb75d589c629eff272ecd5881fe" }

[dev-dependencies]
gridcraft-xlsx = { workspace = true }
cfb = "=0.14.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
