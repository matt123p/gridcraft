[package]
name = "gridcraft-vba"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional tiny-vba workbook host and debugger integration"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vba-compiler = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-diagnostics = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-syntax = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-vm = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-ir = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
gridcraft-engine = { workspace = true }
vba-foreign = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-ide = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-project = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }
vba-values = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }

vba-runtime = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98c7038a297ca9453c01d7e4a5530e8fc8865a10" }

[dev-dependencies]
gridcraft-xlsx = { workspace = true }
cfb = "=0.14.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
