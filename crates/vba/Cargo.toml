[package]
name = "gridcraft-vba"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional tiny-vba workbook host and debugger integration"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vba-compiler = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-diagnostics = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-syntax = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-vm = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-ir = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
gridcraft-engine = { workspace = true }
vba-foreign = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-ide = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-project = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }
vba-values = { git = "https://github.com/matt123p/tiny-vba.git", rev = "98a88c37ac125cf4de65d42c0e9d9120e731e49d" }

[dev-dependencies]
gridcraft-xlsx = { workspace = true }
cfb = "=0.14.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
